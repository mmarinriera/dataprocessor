[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=80" ]

[project]
name = "dataprocessor"
version = "0.1.2"
description = "Helper module to design and run robust and flexible data processing and analysis pipelines."
readme = "README.md"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []
urls.Repository = "https://github.com/mmarinriera/dataprocessor"

[dependency-groups]
dev = [
  "coverage[toml]>=7.13.4",
  "pytest>=9",
  "pytest-lazy-fixtures>=1.4",
]

[tool.setuptools]
packages.find.where = [ "src" ]

[tool.uv]
required-version = ">=0.12.0"

[tool.ruff]
target-version = "py310"
line-length = 120
fix-only = true
lint.select = [ "ALL" ]
lint.ignore = [ "COM812", "D203", "D212" ]
lint.isort.force-single-line = true

[tool.mypy]
ignore_missing_imports = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
warn_unused_configs = true
no_implicit_optional = true
no_implicit_reexport = true
show_error_codes = true

[tool.pytest]
addopts = [ "-s" ]
log_cli = true
log_cli_level = "DEBUG"
minversion = "9.0"
testpaths = [
  "tests",
]

[tool.coverage]
run.source = [ "dataprocessor" ]
run.branch = true
# Regexes for lines to exclude from consideration
report.exclude_also = [
  # Don't complain about abstract methods, they aren't run:
  "@(abc\\.)?abstractmethod",
  # Don't complain about missing debug-only code:
  "def __repr__",
  "if __name__ == .__main__.:",
  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if self\\.debug",
  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",
]
report.ignore_errors = true
html.directory = ".coverage_html_report"

[tool.semantic_release]
allow_zero_version = true
version_toml = [ "pyproject.toml:project.version" ]
build_command = '''    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
'''
commit_message = "chore(release): version {version}"
publish.upload_to_vcs_release = false
changelog.default_templates.changelog_file = "CHANGELOG.md"
branch = "main"
